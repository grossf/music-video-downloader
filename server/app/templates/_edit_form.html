{% from "_video_fields.html" import video_fields %}
<tr id="video-{{ v.video_id }}">
  <td colspan="7">
    <form class="panel"
          hx-post="/videos/{{ v.video_id }}"
          hx-target="#video-{{ v.video_id }}"
          hx-swap="outerHTML">
      {{ video_fields(v, type_options, profile_options, prefix=v.video_id) }}
      <div class="sub" style="margin-top:.7rem">
        Saving renames the file, rewrites the NFO and refreshes Jellyfin.
        Changing the profile does not re-download on its own — use Redownload
        for that.
      </div>
      <div class="actions" style="margin-top:.7rem">
        <button type="button"
                hx-get="/videos/{{ v.video_id }}/row"
                hx-target="#video-{{ v.video_id }}"
                hx-swap="outerHTML">Cancel</button>
        <button class="primary" type="submit">Save</button>
      </div>
    </form>
  </td>
</tr>
