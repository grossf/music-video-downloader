version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly

  # The python base image. yt-dlp itself is updated at container start.
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    # Stay on the Python version CI tests against; moving to a newer one is a
    # deliberate change to the workflow and the image together.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
