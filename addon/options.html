<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #1c1f26; --panel: #232733; --border: #2e3440;
      --text: #e6e9ef; --muted: #949cad; --accent: #6ea8fe;
      --ok: #4ba36b; --err: #cf5c5c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; min-width: 420px;
      background: var(--bg); color: var(--text);
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
    .field { margin-bottom: 12px; }
    label {
      display: block; font-size: 10px; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted); margin-bottom: 4px;
    }
    input {
      width: 100%; font: inherit; color: var(--text);
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 4px; padding: 6px 8px;
    }
    input:focus { outline: 1px solid var(--accent); }
    .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .actions { display: flex; gap: 8px; align-items: center; }
    button {
      font: inherit; border-radius: 4px; padding: 6px 12px; cursor: pointer;
      background: var(--accent); color: #0b1220;
      border: 1px solid var(--accent); font-weight: 600;
    }
    button.secondary {
      background: var(--panel); color: var(--text); border-color: var(--border);
      font-weight: 400;
    }
    #result { font-size: 12px; }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
  </style>
</head>
<body>
  <h1>Music Video Downloader</h1>

  <div class="field">
    <label for="serverUrl">Server URL</label>
    <input id="serverUrl" placeholder="http://localhost:8080">
    <div class="hint">
      Your download server. On the LAN this is plain http, e.g.
      http://homeserver:8080
    </div>
  </div>

  <div class="field">
    <label for="apiToken">API token</label>
    <input id="apiToken" type="password" placeholder="matches API_TOKEN on the server">
    <div class="hint">The same value as API_TOKEN in the server's .env file.</div>
  </div>

  <div class="actions">
    <button id="save">Save</button>
    <button id="test" class="secondary" type="button">Test connection</button>
    <span id="result"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
